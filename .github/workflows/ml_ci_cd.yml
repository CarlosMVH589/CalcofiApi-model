name: CalcofiApi-model CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ ml_ci_cd ]

jobs:
  ml_ci_cd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      
      - name: Pull Git LFS files
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: python version
        run: python --version

      - name: pip install
        run: pip install -r requirements.txt

      - name: train model
        run: python model/train.py
