name: CalcofiApi-model CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ ml_ci_cd ]

jobs:
  ml_ci_cd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Pull Git LFS files
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: python version
        run: python --version

      - name: pip install
        run: pip install -r requirements.txt

      - name: Resolve training inputs
        env:
          DATASET_URL: ${{ github.event.client_payload.dataseturl }}
          TRAINING_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail

          DATASET_URL="${DATASET_URL:-https://github.com/CarlosMVH589/CalcofiApi-model/releases/download/v1.0.0/bottle.csv}"
          TRAINING_SHA="${TRAINING_SHA:-automatic-${GITHUB_SHA}}"

          printf 'DATASET_URL=%s\n' "$DATASET_URL" >> "$GITHUB_ENV"
          printf 'TRAINING_SHA=%s\n' "$TRAINING_SHA" >> "$GITHUB_ENV"

      - name: Download Calcofi dataset
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --retry 3 --silent --show-error \
            --output data/bottle.csv "$DATASET_URL"
          test -s data/bottle.csv
          {
            echo "### Calcofi ML training input"
            echo "- Dataset: \`$DATASET_URL\`"
            echo "- Training SHA: \`$TRAINING_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: train model
        run: python model/train.py

      - name: docker build
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: |
          set -euo pipefail
          : "${DOCKER_USER:?The DOCKER_USER secret is required}"
          : "${MODEL_NAME:?The MODEL_NAME secret is required}"
          : "${TRAINING_SHA:?TRAINING_SHA must be resolved before building}"
          case "$TRAINING_SHA" in
            ''|*[!A-Za-z0-9._-]*)
              echo "TRAINING_SHA contains characters that are invalid in a Docker tag." >&2
              exit 1
              ;;
          esac
          IMAGE="$DOCKER_USER/$MODEL_NAME:$TRAINING_SHA"
          docker buildx build --load --tag "$IMAGE" .

      - name: show images
        run: docker images

      - name: docker login
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USER" --password-stdin

      - name: docker Push
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: |
          set -euo pipefail
          docker push "$DOCKER_USER/$MODEL_NAME:$TRAINING_SHA"
